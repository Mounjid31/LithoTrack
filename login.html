<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://apis.google.com https://*.googleapis.com https://*.firebaseio.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.cloudfunctions.net https://*.firebasestorage.app wss://*.firebaseio.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; worker-src 'self' blob:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LithoTrack — Sign in</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(ellipse at top, #132238 0%, #070b12 60%);
      color: #e2e8f0;
    }
    .card {
      width: min(420px, 92vw);
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 28px 24px 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }
    h1 { margin: 0 0 4px; font-size: 22px; color: #38bdf8; }
    .sub { margin: 0 0 16px; color: #94a3b8; font-size: 13px; }
    label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
    input {
      width: 100%; padding: 10px 12px; margin-bottom: 12px;
      border-radius: 8px; border: 1px solid #334155; background: #0b1220; color: #f1f5f9;
    }
    input:focus { outline: 1px solid #38bdf8; }
    .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    button {
      flex: 1; padding: 11px 12px; border: 0; border-radius: 8px; cursor: pointer;
      font-weight: 600; font-size: 13px; min-width: 120px;
    }
    .primary { background: #0ea5e9; color: #041018; }
    .ghost { background: #1e293b; color: #e2e8f0; }
    .msg { min-height: 18px; font-size: 12px; color: #f87171; margin-top: 10px; line-height: 1.4; }
    .tabs { display: flex; gap: 6px; margin-bottom: 16px; }
    .tabs button { background: #1e293b; color: #94a3b8; }
    .tabs button.active { background: #0369a1; color: #fff; }
    .hidden { display: none; }
    .hint { font-size: 11px; color: #64748b; margin-top: 14px; line-height: 1.45; }
    .linkish { background: none; border: 0; color: #38bdf8; cursor: pointer; font-size: 12px; padding: 0; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>LithoTrack</h1>
    <p class="sub">Sign in required. No access without a verified account.</p>
    <div class="tabs">
      <button type="button" id="tab-login" class="active">Sign in</button>
      <button type="button" id="tab-signup">Create account</button>
      <button type="button" id="tab-reset">Reset password</button>
    </div>

    <div id="form-login">
      <label>Email</label>
      <input id="login-email" type="email" placeholder="you@company.com" autocomplete="username" />
      <label>Password</label>
      <input id="login-pass" type="password" placeholder="••••••••" autocomplete="current-password" />
      <div class="row">
        <button type="button" class="primary" id="btn-login">Sign in</button>
      </div>
      <button type="button" class="linkish" id="btn-resend">Resend verification email</button>
    </div>

    <div id="form-signup" class="hidden">
      <label>Name</label>
      <input id="su-name" type="text" placeholder="Your name" />
      <label>Email</label>
      <input id="su-email" type="email" placeholder="you@company.com" />
      <label>Password (min 6)</label>
      <input id="su-pass" type="password" placeholder="min 6 characters" />
      <div class="row">
        <button type="button" class="primary" id="btn-signup">Create account</button>
      </div>
      <p class="hint">After signup we email you a confirmation link. You must verify before signing in.</p>
    </div>

    <div id="form-reset" class="hidden">
      <label>Email</label>
      <input id="reset-email" type="email" placeholder="you@company.com" />
      <div class="row">
        <button type="button" class="primary" id="btn-reset">Send reset link</button>
      </div>
      <p class="hint">We will send a password reset link to this email.</p>
    </div>

    <div class="msg" id="msg"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const msg = document.getElementById('msg');
    function show(t, ok) {
      msg.style.color = ok ? '#34d399' : '#f87171';
      msg.textContent = t || '';
    }
    function mapErr(e) {
      const c = (e && e.code) || '';
      if (c === 'auth/email-not-verified') return e.message;
      if (c.includes('email-already-in-use')) return 'Email already registered';
      if (c.includes('weak-password')) return 'Password too weak (min 6)';
      if (c.includes('invalid-email')) return 'Invalid email';
      if (c.includes('user-not-found') || c.includes('wrong-password') || c.includes('invalid-credential'))
        return 'Wrong email or password';
      if (c.includes('too-many-requests')) return 'Too many attempts. Try later.';
      if (c.includes('network')) return 'Network error — check internet';
      return (e && e.message) || 'Something went wrong';
    }
    function showForm(which) {
      ['login','signup','reset'].forEach(function (k) {
        document.getElementById('form-' + k).classList.toggle('hidden', k !== which);
        var tab = document.getElementById('tab-' + k);
        if (tab) tab.classList.toggle('active', k === which);
      });
      show('');
    }

    LithoAuth.onAuth(function (user) {
      if (user && user.emailVerified) location.replace('index.html');
    });

    document.getElementById('tab-login').onclick = function () { showForm('login'); };
    document.getElementById('tab-signup').onclick = function () { showForm('signup'); };
    document.getElementById('tab-reset').onclick = function () { showForm('reset'); };

    document.getElementById('btn-login').onclick = async function () {
      show('Signing in…', true);
      try {
        await LithoAuth.login(
          document.getElementById('login-email').value,
          document.getElementById('login-pass').value
        );
        location.replace('index.html');
      } catch (e) { show(mapErr(e)); }
    };

    document.getElementById('btn-signup').onclick = async function () {
      show('Creating account…', true);
      try {
        var r = await LithoAuth.signup(
          document.getElementById('su-name').value,
          document.getElementById('su-email').value,
          document.getElementById('su-pass').value
        );
        show('Account created. Check your inbox for a verification link, then Sign in.', true);
        showForm('login');
        document.getElementById('login-email').value = r.email || '';
      } catch (e) { show(mapErr(e)); }
    };

    document.getElementById('btn-reset').onclick = async function () {
      show('Sending reset email…', true);
      try {
        await LithoAuth.resetPassword(document.getElementById('reset-email').value);
        show('Password reset email sent. Check your inbox.', true);
      } catch (e) { show(mapErr(e)); }
    };

    document.getElementById('btn-resend').onclick = async function () {
      show('Sending verification…', true);
      try {
        await LithoAuth.resendVerification(
          document.getElementById('login-email').value,
          document.getElementById('login-pass').value
        );
        show('Verification email sent. Check inbox/spam.', true);
      } catch (e) { show(mapErr(e)); }
    };
  </script>
</body>
</html>
